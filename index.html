<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVERGLOW</title>
<style>
  @font-face { font-family: "PressStart2P"; src: url("data/PressStart2P-Regular.ttf"); }
  :root {
    --hada: #E22AF5; --luz: #7CCDDE; --flor: #BCFD18; --arbol: #FCF49E;
    --sombra: #4E0E77; --fondo: #07020D; --gris: #8A8494;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--fondo); color: #fff;
    font-family: "PressStart2P", monospace; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px; gap: 12px;
  }
  #juego {
    border: 4px solid var(--luz); background: #000; line-height: 0;
    box-shadow: 6px 6px 0 rgba(0,0,0,.6), 0 0 30px rgba(124,205,222,.15);
  }
  /* Si la ventana es más chica que el juego, se achica sin deformarse */
  #juego canvas { max-width: calc(100vw - 40px); height: auto !important; image-rendering: pixelated; }
  .ayuda { font-size: 8px; color: var(--gris); text-align: center; line-height: 2; margin: 0; }
</style>
</head>
<body>
  <div id="juego"></div>
  <p class="ayuda">[H] controles · [X] sonido · [Esc] menú</p>

  <!-- p5.js (la versión de Processing para la web) -->
  <script src="libraries/p5.min.js"></script>
  <!-- Los módulos del juego. Compat va primero; Main al final. -->
  <script src="Compat.js"></script>
  <script src="Globales.js"></script>
  <script src="Modelo.js"></script>
  <script src="ADN.js"></script>
  <script src="Herramientas.js"></script>
  <script src="Simulacion.js"></script>
  <script src="Red.js"></script>
  <script src="Audio.js"></script>
  <script src="Interfaz.js"></script>
  <script src="DisenoHada.js"></script>
  <script src="Renderizado.js"></script>
  <script src="Main.js"></script>
</body>
</html>
